name: Seedtin
options:
  bundleIdPrefix: com.shimondeitel.seedtin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Seedtin:
    type: application
    platform: iOS
    sources:
      - path: Seedtin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.seedtin
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Seedtin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SeedtinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeedtinTests
      - path: Seedtin.storekit
    dependencies:
      - target: Seedtin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.seedtin.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SeedtinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeedtinUITests
    dependencies:
      - target: Seedtin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.seedtin.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Seedtin:
    build:
      targets:
        Seedtin: all
        SeedtinTests: [test]
        SeedtinUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Seedtin.storekit
    test:
      config: Debug
      storeKitConfiguration: Seedtin.storekit
      targets:
        - SeedtinTests
        - SeedtinUITests
    archive:
      config: Release
